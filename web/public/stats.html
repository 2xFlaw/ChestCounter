<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My stats - Chest Counter</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/theme.css"></head><body><main><header class="hero"><div class="in"><div><div class="lbl eyebrow">2xFlaw's Chest Counter</div><h1>My stats</h1><div id="chips" class="chips"></div></div><div class="resetbox"><div class="lbl">Weekly reset in</div><div class="big num" id="resetCd">--</div><div class="muted">Every Sunday at 14:00 GMT</div></div></div></header><section id="linkSec"></section><section><div class="sh"><h2>Totals</h2><span id="totMeta" class="meta"></span></div><div class="kpis" id="kpis"></div></section><section><div class="sh"><h2>This week</h2><span class="meta">Chests per day since the reset (UTC days).</span></div><div class="card days" id="days"></div></section><section><div class="sh"><h2>Matches</h2><div class="form"><input type="search" id="q" placeholder="Filter by mode or date"><span id="mcount" class="meta"></span></div></div><div class="card tw"><table><thead><tr><th>When</th><th>Mode</th><th>Opened</th><th>Destroyed</th><th>Total</th></tr></thead><tbody id="matches"></tbody></table></div></section><section><div class="sh"><h2>Linked PCs</h2><span class="meta">Each PC you linked. Remove ones you no longer use.</span></div><div class="card" id="pcs"></div></section><section><div class="sh"><h2>Profile and privacy</h2><span class="meta">Syncing is always your choice.</span></div><div class="card" id="settings"></div></section></main><script type="module">
import {$,esc,n0,api,nav,resetInfo,startResetClock} from '/app.js';
nav('account');
startResetClock($('#resetCd'));
async function load(){
await api('/api/profile',{method:'POST'});const me=await api('/api/me');const linked=me.linkedPcs.length>0;
$('#chips').innerHTML=`<span class="chip">Profile ${esc(me.id)}</span><span class="chip ${linked?'mint':'mute'}">${linked?'Linked PCs: '+me.linkedPcs.length:'Sync off'}</span>`+(me.username?`<span class="chip amber">${esc(me.username)}</span>`:'')+(me.is_private?'<span class="chip coral">Private</span>':'');
$('#linkSec').innerHTML=linked?'':`<div class="card"><div class="lbl">Link this site to the app</div><h3>Nothing is uploaded until you say so</h3><p class="muted">Open Settings > Online connection in the Chest Counter app and press the link button. It opens this site and links your PC with one click.</p></div>`;
const t=me.totals;$('#totMeta').textContent=me.starting_total?`Includes starting total of ${n0(me.starting_total)}.`:'';
$('#kpis').innerHTML=[['Global chests',t.global,'var(--acc)','Opened + destroyed'],['Opened',t.opened,'var(--mint)','Starting total included'],['Destroyed',t.destroyed,'var(--amber)','From replays'],['Matches',t.matches,'var(--ink)','Counted from replays']].map(k=>`<div class="card kpi" style="--c:${k[2]}"><div class="lbl">${k[0]}</div><div class="v num">${n0(k[1])}</div><div class="s">${k[3]}</div></div>`).join('');
const start=resetInfo().start;const byDay=Object.fromEntries(me.daily.map(d=>[d.day,d.chests]));const days=Array.from({length:7},(_,i)=>{const d=new Date(start+i*864e5);return{label:d.toLocaleDateString('en-GB',{weekday:'short',timeZone:'UTC'}),chests:byDay[d.toISOString().slice(0,10)]||0};});const max=Math.max(1,...days.map(d=>d.chests));$('#days').innerHTML=days.map(d=>`<div class="day"><div class="b ${d.chests?'':'zero'}" style="height:${Math.max(2,d.chests/max*100)}%">${d.chests?`<span>${n0(d.chests)}</span>`:''}</div><div class="l">${d.label}</div></div>`).join('');
const draw=()=>{const q=$('#q').value.trim().toLowerCase();const list=me.recent.filter(r=>!q||(r.mode||'').toLowerCase().includes(q)||new Date(r.started_at).toLocaleString().toLowerCase().includes(q));$('#mcount').textContent=`${list.length} of ${me.recent.length}`;$('#matches').innerHTML=list.length?list.map(r=>`<tr><td>${esc(new Date(r.started_at).toLocaleString())}</td><td>${esc(r.mode||'-')}</td><td>${n0(r.opened)}</td><td>${n0(r.destroyed)}</td><td>${n0(r.opened+r.destroyed)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">No matches yet. They appear here after your PC syncs.</td></tr>';};$('#q').oninput=draw;draw();
const when=v=>v?new Date(v.includes('T')?v:v.replace(' ','T')+'Z').toLocaleString():'never';
$('#pcs').innerHTML=me.linkedPcs.length?me.linkedPcs.map((p,i)=>`<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;${i?'border-top:1px solid var(--line);':''}"><div><div style="font-weight:800">PC ${i+1} <span class="muted" style="font-weight:400">(${esc(p.id.slice(0,6))})</span></div><div class="muted" style="font-size:12.5px">Linked ${esc(when(p.created_at))} &middot; Last synced ${esc(when(p.last_seen_at))}</div></div><button class="btn danger" data-rm="${esc(p.id)}" type="button">Remove</button></div>`).join(''):'<p class="muted">No PCs linked.</p>';
document.querySelectorAll('[data-rm]').forEach(b=>{b.onclick=async()=>{if(!confirm('Remove this PC? It stops syncing until you link it again.'))return;try{await api('/api/linked-pcs/'+b.dataset.rm,{method:'DELETE'});await load();}catch(e){alert(e.message);}};});
$('#settings').innerHTML=`<label class="lbl" for="user">Username</label><div class="form"><input type="text" id="user" maxlength="20" placeholder="3-20 characters" value="${esc(me.username||'')}"><button class="btn on" id="saveUser">Save username</button></div><p class="muted">Requires a linked PC. Can be changed once every 7 days. Shown on the leaderboard.</p><div class="err" id="userErr"></div><label class="lbl" for="start">Starting total</label><div class="form"><input type="number" id="start" min="0" max="15000" value="${Number(me.starting_total)}"><label><input type="checkbox" id="priv" ${me.is_private?'checked':''}> Private mode (hide me from the leaderboard)</label><button class="btn" id="saveSet">Save</button></div><div id="setErr" class="err"></div><p class="lbl">Your data</p><button class="btn danger" id="del">Delete my data</button>`;
$('#saveUser').onclick=async()=>{try{await api('/api/username',{method:'PUT',body:{username:$('#user').value}});await load();}catch(e){$('#userErr').textContent=e.message;}};
$('#saveSet').onclick=async()=>{try{await api('/api/settings',{method:'PUT',body:{startingTotal:Number($('#start').value),isPrivate:$('#priv').checked}});await load();}catch(e){$('#setErr').textContent=e.message;}};
$('#del').onclick=async()=>{if(!confirm('Delete your profile, linked PCs and all synced matches? This cannot be undone.'))return;try{await api('/api/me',{method:'DELETE'});location.reload();}catch(e){$('#setErr').textContent=e.message;}};
}
load().catch(e=>{$('#linkSec').innerHTML=`<div class="card err">${esc(e.message)}</div>`;});
</script></body></html>
