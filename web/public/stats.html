<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My stats - Chest Counter</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/theme.css"></head><body><main><header class="hero"><div class="in"><div><div class="lbl eyebrow">2xFlaw's Chest Counter</div><h1>My stats</h1><div id="chips" class="chips"></div></div><div class="resetbox"><div class="lbl">Weekly reset in</div><div class="big num" id="resetCd">--</div><div class="muted">Every Sunday at 14:00 GMT</div></div></div></header><section><div class="card" id="syncInfo"></div><p class="err" id="error" role="status"></p><button class="btn" id="refresh">Refresh stats and history</button></section><section><div class="sh"><h2>Personal totals</h2></div><div class="kpis" id="kpis"></div><p class="note" id="totMeta"></p></section><section><div class="sh"><h2>This week</h2><span class="meta">UTC days since the weekly reset</span></div><div class="card days" id="days"></div></section><section><div class="sh"><h2>Match history</h2><input type="search" id="q" placeholder="Filter by mode or ISO date"></div><p class="note" id="mcount"></p><div class="card tw"><table><thead><tr><th>When</th><th>Mode</th><th>Source</th><th>Opened</th><th>Destroyed</th><th>Total</th></tr></thead><tbody id="matches"></tbody></table></div><button class="btn" id="more" hidden>Load more</button></section><section><div class="sh"><h2>Linked PCs</h2></div><div class="card" id="pcs"></div></section><section><div class="sh"><h2>Profile and privacy</h2></div><div class="card" id="settings"></div></section></main><script type="module">
import {$,esc,n0,api,nav,resetInfo,startResetClock} from '/app.js';
nav('account');startResetClock($('#resetCd'));
let next=0,revision='',loaded=0,generation=0,timer;
const fail=e=>{$('#error').textContent=e.message;};
const when=v=>v?new Date(v.includes('T')?v:v.replace(' ','T')+'Z').toLocaleString():'never';
async function history(reset=false){
 if(reset){generation++;next=0;revision='';loaded=0;$('#matches').replaceChildren();}
 const gen=generation,query=$('#q').value.trim();$('#more').disabled=true;
 try{const r=await api('/api/personal/matches?offset='+next+'&q='+encodeURIComponent(query)+(revision?'&revision='+revision:''));if(gen!==generation)return;revision=r.revision||'';loaded+=r.matches.length;
 $('#matches').insertAdjacentHTML('beforeend',r.matches.map(m=>`<tr><td>${m.startedAt?esc(new Date(m.startedAt).toLocaleString()):'Unknown date'}</td><td>${esc(m.mode||'-')}</td><td>${m.origin==='imported'?'Imported replay (personal)':'App replay'}</td><td>${n0(m.opened)}</td><td>${n0(m.destroyed)}</td><td>${n0(m.opened+m.destroyed)}</td></tr>`).join(''));
 if(!loaded)$('#matches').innerHTML='<tr><td colspan="6">No matching matches.</td></tr>';
 next=r.next;$('#more').hidden=next===null;$('#mcount').textContent=`Showing ${loaded} of ${r.total} matches. Manual chest entries are included in the total breakdown, not counted as games.`;
 }catch(e){if(gen===generation)fail(e);}finally{if(gen===generation)$('#more').disabled=false;}
}
$('#q').oninput=()=>{clearTimeout(timer);generation++;timer=setTimeout(()=>history(true),250);};$('#more').onclick=()=>history();
async function load(){
 $('#error').textContent='';await api('/api/profile',{method:'POST'});const me=await api('/api/me'),p=await api('/api/personal/summary');
 $('#chips').innerHTML=`<span class="chip">Profile ${esc(me.id)}</span><span class="chip mint">Linked PCs: ${me.linkedPcs.length}</span>`+(me.username?`<span class="chip amber">${esc(me.username)}</span>`:'');
 const values=p.available?[['Personal total',p.total],['App replay chests',p.replay],['Imported replay chests',p.imported],['Manual additions',p.manual],['Chests before the counter',p.initial||0],['Teammate contribution',p.team],['Personal matches',p.matches]]:[['Synced replay chests',me.totals.global-me.starting_total],['Website starting total',me.starting_total],['Combined legacy total',me.totals.global],['Synced matches',me.totals.matches]];
 $('#kpis').innerHTML=values.map(([label,value])=>`<div class="card kpi"><div class="lbl">${label}</div><div class="v num">${n0(value)}</div></div>`).join('');
 $('#totMeta').textContent=p.available?`Last personal snapshot: ${when(p.updatedAt)}. One PC and one selected app profile are authoritative, preventing duplicated histories across PCs. Website starting total (${n0(me.starting_total)}) is not added again. Manual, imported and teammate contributions do not enter leaderboard rankings through personal sync.`:'Full personal-history sync is not enabled yet. These totals only include synced matches and your website starting total.';
 $('#syncInfo').innerHTML='<h3>Sync your full personal history</h3><p>In the updated Windows app, open Settings > Online connection and choose “Sync full personal history (includes manual additions)”. This works without unlinking. Select the correct app profile first. Keep app sync enabled for future manual edits and deletions to update here.</p><p class="muted">Only statistics are sent, not replay files, manual notes, player names or Epic IDs. App date filters and teammate-count settings apply. Unknown-date matches cannot appear in a daily chart. Leaderboard totals remain separate.</p>'+(p.available?'<button class="btn danger" id="clearPersonal">Clear personal snapshot / change source PC</button>':'');
 const clear=$('#clearPersonal');if(clear)clear.onclick=async()=>{if(!confirm('Stop personal-history sync in the old source app first. Clear the website personal snapshot? Local history and competitive stats are not deleted.'))return;try{await api('/api/personal/snapshot',{method:'DELETE'});await load();}catch(e){fail(e);}};
 const daily=p.available?p.daily:Object.fromEntries(me.daily.map(d=>[d.day,d.chests]));const start=resetInfo().start;const days=Array.from({length:7},(_,i)=>{const d=new Date(start+i*864e5);return{label:d.toLocaleDateString('en-GB',{weekday:'short',timeZone:'UTC'}),value:daily[d.toISOString().slice(0,10)]||0};});const max=Math.max(1,...days.map(d=>d.value));$('#days').innerHTML=days.map(d=>`<div class="day"><div class="b ${d.value?'':'zero'}" style="height:${Math.max(2,d.value/max*100)}%">${d.value?`<span>${n0(d.value)}</span>`:''}</div><div class="l">${d.label}</div></div>`).join('');
 $('#pcs').innerHTML=me.linkedPcs.map((p,i)=>`<div class="form"><span>PC ${i+1} (${esc(p.id.slice(0,6))}): linked ${esc(when(p.created_at))}, last seen ${esc(when(p.last_seen_at))}</span><button class="btn danger" data-rm="${esc(p.id)}">Remove</button></div>`).join('')||'<p>No PCs linked.</p>';
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this linked PC?'))return;try{await api('/api/linked-pcs/'+b.dataset.rm,{method:'DELETE'});await load();}catch(e){fail(e);}});
 $('#settings').innerHTML=`<label for="user">Username</label><div class="form"><input id="user" type="text" maxlength="20" value="${esc(me.username||'')}"><button class="btn" id="saveUser">Save username</button></div><p class="note">Requires a linked PC; changes allowed once every 7 days.</p><div class="form"><label for="start">Legacy website starting total</label><input id="start" type="number" min="0" max="100000" value="${Number(me.starting_total)}"><label><input type="checkbox" id="priv" ${me.is_private?'checked':''}> Private mode</label><button class="btn" id="saveSet">Save</button></div><p class="note">Starting total never counts on the leaderboard. After full personal sync it is retained but excluded from the personal total to avoid double counting.</p><button class="btn danger" id="del">Delete my data</button>`;
 $('#saveUser').onclick=async()=>{try{await api('/api/username',{method:'PUT',body:{username:$('#user').value}});await load();}catch(e){fail(e);}};
 $('#saveSet').onclick=async()=>{try{await api('/api/settings',{method:'PUT',body:{startingTotal:Number($('#start').value),isPrivate:$('#priv').checked}});await load();}catch(e){fail(e);}};
 $('#del').onclick=async()=>{if(!confirm('Permanently delete your profile and all uploaded data?'))return;try{await api('/api/me',{method:'DELETE'});location.reload();}catch(e){fail(e);}};
 await history(true);
}
$('#refresh').onclick=()=>load().catch(fail);load().catch(fail);
</script></body></html>
