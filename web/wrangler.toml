name = "chestcounter-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[build]
command = "node build-branding.mjs && node build-treasure-hour.mjs"
cwd = "."

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/index.html", "/stats", "/stats.html", "/luck", "/luck.html", "/community", "/community.html", "/leaderboard", "/leaderboard.html", "/friends", "/friends.html", "/en", "/en/*", "/en-*", "/es", "/es/*", "/es-*", "/pt", "/pt/*", "/pt-*", "/ru", "/ru/*", "/ru-*", "/fr", "/fr/*", "/fr-*", "/de", "/de/*", "/de-*", "/it", "/it/*", "/it-*", "/pl", "/pl/*", "/pl-*", "/tr", "/tr/*", "/tr-*", "/ja", "/ja/*", "/ja-*"]

# No database_id on purpose: Wrangler creates the D1 database on the first deploy and links it to this Worker.
[[d1_databases]]
binding = "DB"
